<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toy Delivery Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --asphalt:#1E2A38;
    --asphalt-2:#28374A;
    --cone:#FF6B35;
    --cone-dark:#E5551F;
    --laneline:#FFC857;
    --sky:#4FC3F7;
    --cream:#FFF8F0;
    --green:#3DBE7A;
    --radius:20px;
    --shadow: 0 8px 24px rgba(30,42,56,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background: var(--cream);
    color: var(--asphalt);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
  }
  button{
    font-family:'Nunito', sans-serif;
    cursor:pointer;
    border:none;
  }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--sky);
    outline-offset: 2px;
  }

  /* ---------- Road divider (signature element) ---------- */
  .road{
    height:14px;
    background: var(--asphalt);
    position:relative;
    overflow:hidden;
    border-radius:8px;
  }
  .road::after{
    content:"";
    position:absolute;
    top:50%; left:0;
    width:200%;
    height:3px;
    transform:translateY(-50%);
    background-image: repeating-linear-gradient(90deg, var(--laneline) 0 24px, transparent 24px 44px);
    animation: drive 2.4s linear infinite;
  }
  @keyframes drive{ from{transform:translate(0,-50%);} to{transform:translate(-44px,-50%);} }
  @media (prefers-reduced-motion: reduce){ .road::after{ animation:none; } }

  /* ---------- Screens ---------- */
  .screen{ display:none; min-height:100vh; }
  .screen.active{ display:block; }

  /* ---------- Role picker ---------- */
  #roleScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    text-align:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,200,87,0.35), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(79,195,247,0.30), transparent 45%),
      var(--cream);
  }
  #roleScreen .logo{ font-size:56px; margin-bottom:6px; }
  #roleScreen h1{ font-size:clamp(28px,6vw,42px); margin:0 0 4px; color:var(--asphalt); }
  #roleScreen p.sub{ margin:0 0 28px; font-size:17px; color:#5b6b7c; font-weight:700; }
  .role-cards{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:560px;
  }
  .role-card{
    background:white;
    border-radius:var(--radius);
    box-shadow: var(--shadow);
    padding:28px 24px;
    width:230px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition: transform .15s ease, box-shadow .15s ease;
    border: 3px solid transparent;
  }
  .role-card:hover{ transform: translateY(-4px); box-shadow: 0 14px 30px rgba(30,42,56,0.22); }
  .role-card .emoji{ font-size:46px; }
  .role-card h3{ margin:0; font-size:20px; }
  .role-card p{ margin:0; font-size:14px; color:#6b7889; font-weight:600; }
  .role-card.order-role{ border-color: var(--cone); }
  .role-card.deliver-role{ border-color: var(--sky); }

  /* ---------- Top bar ---------- */
  .topbar{
    background: var(--asphalt);
    color:white;
    padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  .topbar .title{
    display:flex; align-items:center; gap:10px;
    font-size:20px; font-weight:800;
  }
  .topbar .title .emoji{ font-size:26px; }
  .switch-role{
    background: rgba(255,255,255,0.12);
    color:white;
    padding:8px 14px;
    border-radius:999px;
    font-weight:700;
    font-size:13px;
  }
  .switch-role:hover{ background: rgba(255,255,255,0.22); }

  .content{ max-width:900px; margin:0 auto; padding:24px 18px 60px; }

  /* ---------- Order view ---------- */
  .item-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap:14px;
    margin:18px 0 100px;
  }
  .item-card{
    background:white;
    border-radius:16px;
    box-shadow: var(--shadow);
    padding:14px 10px 12px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .item-card .art{
    width:72px; height:72px;
    border-radius:16px;
    background: linear-gradient(160deg, #FFE8CE, #FFD8B8);
    display:flex; align-items:center; justify-content:center;
    font-size:36px;
    overflow:hidden;
  }
  .item-card .art img{ width:100%; height:100%; object-fit:cover; }
  .item-card .name{ font-weight:800; font-size:14px; line-height:1.2; }
  .qty-row{ display:flex; align-items:center; gap:10px; }
  .qty-btn{
    width:30px; height:30px; border-radius:50%;
    background: var(--cream); color: var(--asphalt);
    font-size:18px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-btn:hover{ background:#ffe3c9; }
  .qty-val{ font-weight:800; min-width:16px; text-align:center; }
  .add-btn{
    width:100%;
    background: var(--cone);
    color:white;
    font-weight:800;
    font-size:13px;
    padding:9px 0;
    border-radius:10px;
  }
  .add-btn:hover{ background: var(--cone-dark); }
  .add-btn.in-cart{ background: var(--green); }

  .empty-note{
    text-align:center; color:#8a97a6; font-weight:700; padding:30px 10px;
  }

  /* ---------- Cart bar ---------- */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--asphalt);
    color:white;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:center; gap:16px;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.25);
    transform: translateY(120%);
    transition: transform .25s ease;
    z-index:20;
  }
  .cart-bar.show{ transform: translateY(0); }
  .cart-bar .cart-info{ font-weight:800; font-size:15px; }
  .cart-bar button.send{
    background: var(--laneline);
    color: var(--asphalt);
    font-weight:800;
    padding:10px 20px;
    border-radius:999px;
    font-size:15px;
  }
  .cart-bar button.send:hover{ background:#ffd97a; }

  /* ---------- Orders list (order view "my orders") ---------- */
  .section-title{
    font-size:20px; margin:26px 0 4px;
  }
  .section-sub{ margin:0 0 14px; color:#7a8794; font-weight:600; font-size:13px; }

  .order-card{
    background:white; border-radius:16px; box-shadow: var(--shadow);
    padding:16px; margin-bottom:14px;
  }
  .order-card .order-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;
  }
  .order-items-line{ font-weight:800; font-size:15px; }
  .order-note{ font-size:12.5px; color:#8a97a6; font-weight:600; margin-top:2px; }
  .order-time{ font-size:11.5px; color:#a7b2bd; font-weight:700; white-space:nowrap; }

  /* progress track */
  .track{ position:relative; margin-top:10px; }
  .track .line{
    height:6px; background:#eef1f4; border-radius:4px; position:relative; overflow:visible;
  }
  .track .line-fill{
    height:6px; border-radius:4px; background: var(--green);
    transition: width .4s ease;
  }
  .track .steps{
    display:flex; justify-content:space-between; margin-top:6px;
  }
  .track .step{ font-size:10.5px; font-weight:800; color:#b5bfc9; text-align:center; flex:1; }
  .track .step.done{ color: var(--green); }
  .track .car{
    position:absolute; top:-16px;
    font-size:20px;
    transition: left .4s ease;
    transform: translateX(-50%);
  }

  /* ---------- Dispatch view ---------- */
  .board{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px;
    margin-top:18px;
  }
  @media (max-width:720px){ .board{ grid-template-columns:1fr; } }
  .col{
    background: rgba(255,255,255,0.6);
    border-radius:16px;
    padding:12px;
    min-height:80px;
  }
  .col h4{
    margin:2px 4px 10px;
    font-size:14px;
    display:flex; align-items:center; gap:6px;
  }
  .col .count{
    background: var(--asphalt); color:white; border-radius:999px;
    font-size:11px; padding:1px 8px; font-weight:800;
  }
  .dispatch-card{
    background:white; border-radius:14px; box-shadow: var(--shadow);
    padding:14px; margin-bottom:10px;
  }
  .dispatch-card .head{ display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .dispatch-card .art{
    width:46px; height:46px; border-radius:12px;
    background: linear-gradient(160deg, #FFE8CE, #FFD8B8);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    overflow:hidden; flex-shrink:0;
  }
  .dispatch-card .art img{ width:100%; height:100%; object-fit:cover; }
  .dispatch-card .iname{ font-weight:800; font-size:14.5px; }
  .dispatch-card .qty{ font-size:12px; color:#8a97a6; font-weight:700; }
  .dispatch-card .note{ font-size:12.5px; background:#fff6ea; border-radius:8px; padding:6px 9px; margin:6px 0; font-weight:600; color:#6b5a3d; }
  .dispatch-card .action{
    width:100%; padding:10px 0; border-radius:10px; font-weight:800; font-size:13.5px; color:white; margin-top:6px;
  }
  .action.accept{ background: var(--sky); }
  .action.accept:hover{ background:#2fb3ee; }
  .action.deliver{ background: var(--cone); }
  .action.deliver:hover{ background: var(--cone-dark); }
  .action.done{ background: var(--green); }
  .action.done:hover{ background:#2fa468; }
  .col-empty{ text-align:center; color:#a7b2bd; font-weight:700; font-size:12.5px; padding:16px 6px; }

  /* ---------- Manage menu (dispatch view) ---------- */
  details.manage{
    margin-top:30px; background:white; border-radius:16px; box-shadow:var(--shadow); padding:14px 16px;
  }
  details.manage summary{ font-weight:800; cursor:pointer; font-size:15px; }
  .manage-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .manage-row{ display:flex; align-items:center; gap:10px; background:#faf8f4; border-radius:10px; padding:8px 10px; }
  .manage-row .art{ width:34px; height:34px; border-radius:8px; background:#FFE8CE; display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden; }
  .manage-row .art img{ width:100%; height:100%; object-fit:cover; }
  .manage-row .mname{ flex:1; font-weight:700; font-size:13.5px; }
  .manage-row .del{ background:#ffe6e6; color:#c0392b; font-weight:800; font-size:11px; padding:5px 9px; border-radius:8px; }
  .add-item-form{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .add-item-form input, .add-item-form select{
    font-family:'Nunito',sans-serif; border:2px solid #eee1cf; border-radius:10px; padding:8px 10px; font-size:13.5px;
  }
  .add-item-form input[name="name"]{ flex:1; min-width:120px; }
  .add-item-form input[name="image_url"]{ flex:2; min-width:160px; }
  .add-item-form button{
    background: var(--asphalt); color:white; font-weight:800; padding:8px 16px; border-radius:10px; font-size:13px;
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-20px);
    background: var(--asphalt); color:white; padding:10px 18px; border-radius:999px;
    font-weight:800; font-size:13.5px; opacity:0; pointer-events:none; transition:.25s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .footer-note{ text-align:center; color:#a7b2bd; font-size:11.5px; font-weight:700; margin-top:30px; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ROLE PICKER -->
<div class="screen active" id="roleScreen">
  <div class="logo">🚗📦</div>
  <h1>Toy Delivery Co.</h1>
  <p class="sub">Who's using this device?</p>
  <div class="role-cards">
    <button class="role-card order-role" data-role="order">
      <div class="emoji">🛒</div>
      <h3>I'm Ordering</h3>
      <p>Pick stuff & send the order</p>
    </button>
    <button class="role-card deliver-role" data-role="deliver">
      <div class="emoji">🚚</div>
      <h3>I'm Delivering</h3>
      <p>See orders & deliver them</p>
    </button>
  </div>
</div>

<!-- ORDER SCREEN -->
<div class="screen" id="orderScreen">
  <div class="topbar">
    <div class="title"><span class="emoji">🛒</span> Order Something</div>
    <button class="switch-role" data-switch>Switch device role</button>
  </div>
  <div class="road"></div>
  <div class="content">
    <div id="orderItemGrid" class="item-grid"></div>

    <h2 class="section-title">🚗 My Orders</h2>
    <p class="section-sub">Live status, straight from the delivery truck</p>
    <div id="myOrders"></div>
    <div class="footer-note">Menu updates instantly when the driver adds new items.</div>
  </div>

  <div class="cart-bar" id="cartBar">
    <div class="cart-info" id="cartInfo">0 items</div>
    <button class="send" id="sendOrderBtn">Send Order 🚗💨</button>
  </div>
</div>

<!-- DISPATCH SCREEN -->
<div class="screen" id="dispatchScreen">
  <div class="topbar">
    <div class="title"><span class="emoji">🚚</span> Delivery Dispatch</div>
    <button class="switch-role" data-switch>Switch device role</button>
  </div>
  <div class="road"></div>
  <div class="content">
    <div class="board">
      <div class="col">
        <h4>📥 New <span class="count" id="cntPending">0</span></h4>
        <div id="colPending"></div>
      </div>
      <div class="col">
        <h4>🧰 Getting Ready <span class="count" id="cntAccepted">0</span></h4>
        <div id="colAccepted"></div>
      </div>
      <div class="col">
        <h4>🚗 On The Way <span class="count" id="cntDelivering">0</span></h4>
        <div id="colDelivering"></div>
      </div>
    </div>

    <details class="manage">
      <summary>🧾 Manage the Menu</summary>
      <div class="manage-list" id="manageList"></div>
      <form class="add-item-form" id="addItemForm">
        <input type="text" name="emoji" placeholder="Emoji" maxlength="4" style="width:60px;text-align:center;" value="📦">
        <input type="text" name="name" placeholder="Item name" required>
        <input type="url" name="image_url" placeholder="Photo URL (add later, optional)">
        <button type="submit">Add Item</button>
      </form>
    </details>
  </div>
</div>

<script>
/* ================= STATE ================= */
let items = [];         // menu items from td_items
let orders = [];        // orders from td_orders
let cart = {};           // { item_id: qty }

const STATUS_STEPS = ["pending","accepted","delivering","delivered"];
const STATUS_LABEL = { pending:"Sent", accepted:"Accepted", delivering:"On the Way", delivered:"Delivered" };

/* ================= HELPERS ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function artHTML(item){
  if(item.image_url){
    return `<img src="${escapeAttr(item.image_url)}" alt="${escapeAttr(item.name)}" onerror="this.parentElement.innerHTML='${item.emoji||'📦'}'">`;
  }
  return item.emoji || '📦';
}
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(iso){
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const min = Math.floor(diff/60000);
  if(min < 1) return "just now";
  if(min < 60) return min+"m ago";
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+"h ago";
  return Math.floor(hr/24)+"d ago";
}

/* ================= ROLE SWITCHING ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setRole(role){
  localStorage.setItem('td_role', role);
  if(role === 'order'){ showScreen('orderScreen'); renderOrderItems(); renderMyOrders(); }
  else if(role === 'deliver'){ showScreen('dispatchScreen'); renderBoard(); renderManageList(); }
  else { showScreen('roleScreen'); }
}
document.querySelectorAll('[data-role]').forEach(btn=>{
  btn.addEventListener('click', ()=> setRole(btn.dataset.role));
});
document.querySelectorAll('[data-switch]').forEach(btn=>{
  btn.addEventListener('click', ()=>{ localStorage.removeItem('td_role'); showScreen('roleScreen'); });
});

/* ================= SUPABASE CLIENT ================= */
const SUPABASE_URL = "https://kughalejiydqtseuyrni.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1Z2hhbGVqaXlkcXRzZXV5cm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MzY1NTAsImV4cCI6MjA5NjIxMjU1MH0.Eti8hM2qhHJnhaDmzVR0I2K7zOEiK8H2KEBJeWJiLE8";
let sb = null;
try{
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(err){
  console.error('Supabase failed to load:', err);
  toast('Could not connect — check your internet connection');
}

/* ================= DATA LOADING ================= */
async function loadItems(){
  if(!sb) return;
  const { data, error } = await sb.from('td_items').select('*').eq('active', true).order('sort_order', {ascending:true}).order('created_at', {ascending:true});
  if(error){ console.error(error); toast('Could not load menu'); return; }
  items = data || [];
  renderOrderItems();
  renderManageList();
}
async function loadOrders(){
  if(!sb) return;
  const { data, error } = await sb.from('td_orders').select('*').order('created_at', {ascending:false}).limit(60);
  if(error){ console.error(error); toast('Could not load orders'); return; }
  orders = data || [];
  renderMyOrders();
  renderBoard();
}

/* ================= ORDER VIEW ================= */
function renderOrderItems(){
  const grid = document.getElementById('orderItemGrid');
  if(!items.length){
    grid.innerHTML = `<div class="empty-note">No items on the menu yet.<br>Ask the driver to add some! 🚚</div>`;
    updateCartBar();
    return;
  }
  grid.innerHTML = items.map(it => {
    const qty = cart[it.id] || 0;
    return `
      <div class="item-card">
        <div class="art">${artHTML(it)}</div>
        <div class="name">${escapeHTML(it.name)}</div>
        <div class="qty-row">
          <button class="qty-btn" data-dec="${it.id}">−</button>
          <span class="qty-val" id="qty-${it.id}">${qty}</span>
          <button class="qty-btn" data-inc="${it.id}">+</button>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
  grid.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));
}
function changeQty(id, delta){
  const next = (cart[id]||0) + delta;
  if(next <= 0){ delete cart[id]; } else { cart[id] = next; }
  const el = document.getElementById('qty-'+id);
  if(el) el.textContent = cart[id] || 0;
  updateCartBar();
}
function updateCartBar(){
  const bar = document.getElementById('cartBar');
  const totalQty = Object.values(cart).reduce((a,b)=>a+b,0);
  if(totalQty > 0){
    bar.classList.add('show');
    document.getElementById('cartInfo').textContent = `${totalQty} item${totalQty>1?'s':''} ready to send`;
  } else {
    bar.classList.remove('show');
  }
}
document.getElementById('sendOrderBtn').addEventListener('click', sendOrder);
async function sendOrder(){
  if(!sb){ toast('Not connected — check your internet'); return; }
  const entries = Object.entries(cart);
  if(!entries.length) return;
  const rows = entries.map(([itemId, qty])=>{
    const it = items.find(i=>i.id === itemId);
    return {
      item_id: itemId,
      item_name: it ? it.name : 'Item',
      item_emoji: it ? it.emoji : '📦',
      item_image_url: it ? it.image_url : null,
      quantity: qty,
      status: 'pending'
    };
  });
  const { error } = await sb.from('td_orders').insert(rows);
  if(error){ console.error(error); toast('Could not send order'); return; }
  cart = {};
  renderOrderItems();
  updateCartBar();
  toast('Order sent! 🚗💨');
}
function renderMyOrders(){
  const wrap = document.getElementById('myOrders');
  if(!orders.length){
    wrap.innerHTML = `<div class="empty-note">No orders yet — pick something above!</div>`;
    return;
  }
  wrap.innerHTML = orders.map(orderCardHTML).join('');
}
function orderCardHTML(o){
  const stepIndex = STATUS_STEPS.indexOf(o.status);
  const pct = (stepIndex / (STATUS_STEPS.length-1)) * 100;
  return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-items-line">${o.item_emoji||'📦'} ${o.quantity}× ${escapeHTML(o.item_name)}</div>
          ${o.note ? `<div class="order-note">"${escapeHTML(o.note)}"</div>` : ''}
        </div>
        <div class="order-time">${timeAgo(o.created_at)}</div>
      </div>
      <div class="track">
        <div class="car" style="left:${pct}%">🚗</div>
        <div class="line"><div class="line-fill" style="width:${pct}%"></div></div>
        <div class="steps">
          ${STATUS_STEPS.map((s,i)=>`<div class="step ${i<=stepIndex?'done':''}">${STATUS_LABEL[s]}</div>`).join('')}
        </div>
      </div>
    </div>`;
}

/* ================= DISPATCH VIEW ================= */
function renderBoard(){
  const groups = { pending: [], accepted: [], delivering: [] };
  orders.forEach(o=>{ if(groups[o.status]) groups[o.status].push(o); });

  document.getElementById('cntPending').textContent = groups.pending.length;
  document.getElementById('cntAccepted').textContent = groups.accepted.length;
  document.getElementById('cntDelivering').textContent = groups.delivering.length;

  renderCol('colPending', groups.pending, 'accept', 'Accept ✅');
  renderCol('colAccepted', groups.accepted, 'deliver', 'Start Delivery 🚗');
  renderCol('colDelivering', groups.delivering, 'done', 'Delivered 🎉');
}
function renderCol(elId, list, actionClass, actionLabel){
  const el = document.getElementById(elId);
  if(!list.length){ el.innerHTML = `<div class="col-empty">Nothing here</div>`; return; }
  el.innerHTML = list.map(o => `
    <div class="dispatch-card">
      <div class="head">
        <div class="art">${artHTML({emoji:o.item_emoji, image_url:o.item_image_url, name:o.item_name})}</div>
        <div>
          <div class="iname">${escapeHTML(o.item_name)}</div>
          <div class="qty">Qty ${o.quantity} · ${timeAgo(o.created_at)}</div>
        </div>
      </div>
      ${o.note ? `<div class="note">"${escapeHTML(o.note)}"</div>` : ''}
      <button class="action ${actionClass}" data-advance="${o.id}" data-current="${o.status}">${actionLabel}</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-advance]').forEach(b=>{
    b.addEventListener('click', ()=> advanceOrder(b.dataset.advance, b.dataset.current));
  });
}
async function advanceOrder(id, current){
  if(!sb){ toast('Not connected — check your internet'); return; }
  const idx = STATUS_STEPS.indexOf(current);
  const next = STATUS_STEPS[idx+1];
  if(!next) return;
  const { error } = await sb.from('td_orders').update({ status: next, updated_at: new Date().toISOString() }).eq('id', id);
  if(error){ console.error(error); toast('Could not update order'); return; }
  toast(next === 'delivered' ? 'Delivered! 🎉' : 'Updated!');
}

/* ================= MANAGE MENU ================= */
function renderManageList(){
  const wrap = document.getElementById('manageList');
  if(!items.length){ wrap.innerHTML = `<div class="col-empty">No items yet — add one below</div>`; return; }
  wrap.innerHTML = items.map(it => `
    <div class="manage-row">
      <div class="art">${artHTML(it)}</div>
      <div class="mname">${escapeHTML(it.name)}</div>
      <button class="del" data-del="${it.id}">Remove</button>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=> removeItem(b.dataset.del));
  });
}
async function removeItem(id){
  if(!sb){ toast('Not connected — check your internet'); return; }
  const { error } = await sb.from('td_items').update({ active:false }).eq('id', id);
  if(error){ console.error(error); toast('Could not remove item'); return; }
  toast('Item removed');
}
document.getElementById('addItemForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!sb){ toast('Not connected — check your internet'); return; }
  const fd = new FormData(e.target);
  const name = (fd.get('name')||'').toString().trim();
  const emoji = (fd.get('emoji')||'📦').toString().trim() || '📦';
  const image_url = (fd.get('image_url')||'').toString().trim() || null;
  if(!name) return;
  const { error } = await sb.from('td_items').insert([{ name, emoji, image_url, active:true }]);
  if(error){ console.error(error); toast('Could not add item'); return; }
  e.target.reset();
  e.target.querySelector('[name="emoji"]').value = '📦';
  toast('Item added!');
});

/* ================= REALTIME ================= */
if(sb){
  sb.channel('td_orders_live')
    .on('postgres_changes', { event:'*', schema:'public', table:'td_orders' }, () => loadOrders())
    .subscribe();

  sb.channel('td_items_live')
    .on('postgres_changes', { event:'*', schema:'public', table:'td_items' }, () => loadItems())
    .subscribe();
}

/* ================= INIT ================= */
(async function init(){
  await Promise.all([loadItems(), loadOrders()]);
  const savedRole = localStorage.getItem('td_role');
  if(savedRole === 'order' || savedRole === 'deliver'){ setRole(savedRole); }
})();
</script>
